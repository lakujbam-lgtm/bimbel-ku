<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BimbelKu - Fundamental Bahasa</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <header class="sticky top-0 z-50 w-full backdrop-blur border-b border-slate-800 bg-slate-900/90">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="font-bold text-xl text-sky-500">Bimbel<span class="text-white">Ku</span></a>
      <a href="fundamental.html" class="text-sm text-sky-400 hover:underline">&larr; Kembali ke Fundamental</a>
    </div>
  </header>

  <main class="flex-grow max-w-5xl mx-auto px-4 py-10 w-full">
    <h3 class="font-bold text-3xl text-white mb-2">Fundamental Bahasa</h3>
    <p class="text-slate-400 text-sm mb-8">Pelajari materi dasar tata bahasa Indonesia melalui video interaktif dan latihan soal berikut:</p>

    <!-- Video & Soal 1 -->
    <div class="p-6 bg-slate-800/80 rounded-2xl border border-slate-700 mb-8 space-y-4">
      <h4 class="font-bold text-xl text-sky-400">1. Fundamental Bahasa - Video 1</h4>
      <div class="aspect-video w-full rounded-lg overflow-hidden border border-slate-700">
        <iframe class="w-full h-full" src="https://www.youtube.com/embed/4tg01rmxxlI" title="YouTube video player" frameborder="0" allowfullscreen></iframe>
      </div>
      <div class="p-4 bg-slate-900/60 rounded-xl border border-slate-700 space-y-3">
        <p class="font-semibold text-white">Soal 1: Huruf apakah yang termasuk dalam kelompok vokal dalam abjad Bahasa Indonesia?</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <button type="button" onclick="cekJawaban(this, true, 'Benar! Huruf vokal terdiri dari a, e, i, o, u.')" class="py-2.5 px-3 bg-slate-800 hover:bg-slate-700 rounded-lg text-left text-sm transition">A. a, e, i, o, u</button>
          <button type="button" onclick="cekJawaban(this, false, 'Salah! b, c, d, f adalah huruf konsonan.')" class="py-2.5 px-3 bg-slate-800 hover:bg-slate-700 rounded-lg text-left text-sm transition">B. b, c, d, f, g</button>
        </div>
        <p class="feedback-text text-xs mt-2 hidden font-medium"></p>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
