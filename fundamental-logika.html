<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <title>BimbelKu - Fundamental Logika</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
  <header class="sticky top-0 z-50 w-full backdrop-blur border-b border-slate-800 bg-slate-900/90">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="font-bold text-xl text-sky-500">Bimbel<span class="text-white">Ku</span></a>
      <a href="fundamental.html" class="text-sm text-sky-400 hover:underline">&larr; Kembali ke Fundamental</a>
    </div>
  </header>
  <main class="flex-grow max-w-4xl mx-auto px-4 py-10 w-full space-y-6">
    <h3 class="font-bold text-2xl text-white">Fundamental Logika</h3>
    <div class="p-4 bg-slate-800/80 rounded-xl border border-slate-700 space-y-4">
      <h4 class="font-bold text-sky-400">Latihan Soal Logika</h4>
      <div class="p-3 bg-slate-900/60 rounded-lg border border-slate-700 text-sm">
        <p class="mb-3">Jika A > B dan B > C, maka hubungan A dan C adalah...</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <button onclick="cekJawaban(this, true, 'Benar! Sifat transitif A > C.')" class="py-2 px-3 bg-slate-800 text-left rounded-lg">A. A > C</button>
          <button onclick="cekJawaban(this, false, 'Salah!')" class="py-2 px-3 bg-slate-800 text-left rounded-lg">B. A < C</button>
        </div>
        <p class="feedback-text text-xs mt-2 hidden font-medium"></p>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
