<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Belajar Interaktif</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
            user-select: none;
        }

        body {
            background-color: #131f24;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 850px;
            background-color: #131f24;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #131f24;
            z-index: 10;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 16px;
            font-weight: 800;
        }

        /* Styling Dropdown Ganti Logo */
        .settings-bar {
            margin: 0 20px 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #202f36;
            padding: 10px 15px;
            border-radius: 10px;
            z-index: 10;
        }
        
        .settings-bar label {
            font-size: 14px;
            font-weight: bold;
            color: #afbac0;
        }

        .settings-bar select {
            background-color: #131f24;
            color: white;
            border: 2px solid #37464f;
            padding: 5px 10px;
            border-radius: 8px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        .unit-banner {
            background-color: #58cc02;
            margin: 0 20px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 0 #46a302;
            z-index: 10;
        }
        .unit-banner h2 { font-size: 18px; text-transform: uppercase; letter-spacing: 1px;}
        .unit-banner p { font-size: 14px; opacity: 0.9; margin-top: 5px;}

        .path-container {
            flex: 1;
            overflow-y: auto;
            position: relative;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            padding: 100px 0 150px 0;
            gap: 40px;
            scroll-behavior: smooth;
        }

        .path-container::-webkit-scrollbar { display: none; }

        .level-node {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .node-completed {
            background-color: #ffc800;
            box-shadow: 0 8px 0 #e5a400, inset 0 -4px 0 rgba(0,0,0,0.1);
        }

        .node-active {
            background-color: #58cc02;
            box-shadow: 0 8px 0 #46a302, 0 0 0 8px rgba(88, 204, 2, 0.3), inset 0 -4px 0 rgba(0,0,0,0.1);
            animation: pulseActive 2s infinite;
        }

        @keyframes pulseActive {
            0% { box-shadow: 0 8px 0 #46a302, 0 0 0 8px rgba(88, 204, 2, 0.3), inset 0 -4px 0 rgba(0,0,0,0.1); }
            50% { box-shadow: 0 8px 0 #46a302, 0 0 0 15px rgba(88, 204, 2, 0.1), inset 0 -4px 0 rgba(0,0,0,0.1); }
            100% { box-shadow: 0 8px 0 #46a302, 0 0 0 8px rgba(88, 204, 2, 0.3), inset 0 -4px 0 rgba(0,0,0,0.1); }
        }

        .node-locked {
            background-color: #37464f;
            box-shadow: 0 8px 0 #202f36;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .final-logo {
            width: 120px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(255, 200, 0, 0.6));
            animation: floatLogo 3s ease-in-out infinite;
        }

        @keyframes floatLogo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px) scale(1.05); }
        }

        #avatar {
            position: absolute;
            font-size: 50px;
            transition: top 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), left 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 5;
            pointer-events: none;
            filter: drop-shadow(0 10px 5px rgba(0,0,0,0.3));
        }

        .floating {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            color: #333;
            width: 80%;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-content.show { transform: scale(1); }
        .modal-content h3 { font-size: 22px; margin-bottom: 15px; color: #131f24; }
        .modal-content .video-mockup {
            width: 100%; height: 120px; background: #ddd; border-radius: 10px; margin-bottom: 20px;
            display: flex; justify-content: center; align-items: center; font-size: 40px; color: #ff0000;
        }
        .modal-btn {
            background-color: #1cb0f6; border: none; box-shadow: 0 4px 0 #1899d6;
            color: white; padding: 15px 30px; font-size: 16px; font-weight: bold;
            border-radius: 15px; cursor: pointer; width: 100%; transition: 0.1s;
        }
        .modal-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #1899d6; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="stat"><span style="color: #ffc800;">👑</span> 1</div>
        <div class="stat"><span style="color: #ff4b4b;">❤️</span> 5</div>
        <div class="stat"><span style="color: #1cb0f6;">💎</span> 520</div>
    </div>

    <!-- Pilihan Ganti Logo -->
    <div class="settings-bar">
        <label for="logo-selector">Pilih Kampus Tujuan:</label>
        <select id="logo-selector" onchange="changeFinalLogo()">
            <!-- Ganti 'value' dengan nama file asli yang Anda upload di GitHub -->
            <option value="50202.png">Universitas Indonesia</option>
            <option value="ugm.png">UGM</option>
            <option value="itb.png">ITB</option>
            <option value="unpad.png">UNPAD</option>
        </select>
    </div>

    <div class="unit-banner">
        <h2>Bagian 1, Unit 1</h2>
        <p>Tonton video, jawab soal, dan maju ke level selanjutnya!</p>
    </div>

    <div class="path-container" id="path-area">
        <div id="avatar" class="floating">🦉</div>
    </div>

    <div class="modal-overlay" id="task-modal">
        <div class="modal-content" id="modal-box">
            <h3>Belajar Dulu!</h3>
            <div class="video-mockup">▶️</div>
            <p style="margin-bottom: 20px; font-weight:bold;">1 + 1 = ?</p>
            <button class="modal-btn" onclick="completeTask()">Selesaikan Level</button>
        </div>
    </div>
</div>

<script>
    const totalLevels = 10;
    let currentLevel = 1;
    const pathArea = document.getElementById('path-area');
    const avatar = document.getElementById('avatar');
    const modal = document.getElementById('task-modal');
    const modalBox = document.getElementById('modal-box');
    const wavePattern = [0, -40, -60, -40, 0, 40, 60, 40];

    function generateLevels() {
        for (let i = 1; i <= totalLevels; i++) {
            const node = document.createElement('div');
            node.classList.add('level-node');
            node.id = `level-${i}`;
            
            node.innerHTML = (i % 5 === 0) ? '🎁' : '⭐';
            
            const offset = wavePattern[(i - 1) % wavePattern.length];
            node.style.transform = `translateX(${offset}px)`;
            node.onclick = () => handleNodeClick(i);
            pathArea.appendChild(node);
        }
        
        // Membuat Logo Akhir
        const topLogo = document.createElement('img');
        topLogo.id = 'final-logo-img'; // Tambahkan ID agar mudah diubah dari JavaScript
        // Ambil nilai awal dari dropdown
        const selector = document.getElementById('logo-selector');
        topLogo.src = selector.value; 
        topLogo.alt = 'Logo Universitas Tujuan';
        topLogo.className = 'final-logo';
        
        pathArea.appendChild(topLogo);
        updateLevels();
    }

    // FUNGSI BARU: Untuk mengganti logo secara real-time
    function changeFinalLogo() {
        const selector = document.getElementById('logo-selector');
        const logoImg = document.getElementById('final-logo-img');
        if (logoImg) {
            logoImg.src = selector.value;
        }
    }

    function updateLevels() {
        for (let i = 1; i <= totalLevels; i++) {
            const node = document.getElementById(`level-${i}`);
            node.className = 'level-node';
            
            if (i < currentLevel) {
                node.classList.add('node-completed');
            } else if (i === currentLevel) {
                node.classList.add('node-active');
                moveAvatarTo(node);
            } else {
                node.classList.add('node-locked');
            }
        }
    }

    function moveAvatarTo(nodeElement) {
        setTimeout(() => {
            const offsetTop = nodeElement.offsetTop;
            avatar.style.top = `${offsetTop - 45}px`;
            const transformX = parseInt(nodeElement.style.transform.match(/-?\d+/)[0]);
            avatar.style.left = `calc(50% + ${transformX}px + 20px)`; 

            nodeElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
    }

    function handleNodeClick(levelIndex) {
        if (levelIndex === currentLevel) {
            modal.style.display = 'flex';
            setTimeout(() => modalBox.classList.add('show'), 10);
        } else if (levelIndex > currentLevel) {
            const node = document.getElementById(`level-${levelIndex}`);
            node.style.transform = `translateX(${wavePattern[(levelIndex - 1) % wavePattern.length]}px) scale(0.9)`;
            setTimeout(() => {
                node.style.transform = `translateX(${wavePattern[(levelIndex - 1) % wavePattern.length]}px) scale(1)`;
            }, 150);
        }
    }

    function completeTask() {
        modalBox.classList.remove('show');
        setTimeout(() => {
            modal.style.display = 'none';
            if (currentLevel < totalLevels) {
                currentLevel++;
                updateLevels();
            } else {
                alert("Selamat! Anda telah menyelesaikan semua level dan mencapai target!");
            }
        }, 300);
    }

    window.onload = () => {
        generateLevels();
    };
</script>

</body>
</html>
