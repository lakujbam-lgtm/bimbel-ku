<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Belajar Interaktif</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
            user-select: none;
        }

        body {
            background-color: #131f24;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 850px;
            background-color: #131f24;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #131f24;
            z-index: 10;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 16px;
            font-weight: 800;
        }

        .unit-banner {
            background-color: #58cc02;
            margin: 0 20px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 0 #46a302;
            z-index: 10;
        }
        .unit-banner h2 { font-size: 18px; text-transform: uppercase; letter-spacing: 1px;}
        .unit-banner p { font-size: 14px; opacity: 0.9; margin-top: 5px;}

        .path-container {
            flex: 1;
            overflow-y: auto;
            position: relative;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            padding: 100px 0 150px 0;
            gap: 80px; /* Jarak antar level yang sudah dijauhkan */
            scroll-behavior: smooth;
        }

        .path-container::-webkit-scrollbar { display: none; }

        .level-node {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .node-completed {
            background-color: #ffc800;
            box-shadow: 0 8px 0 #e5a400, inset 0 -4px 0 rgba(0,0,0,0.1);
        }

        .node-active {
            background-color: #58cc02;
            box-shadow: 0 8px 0 #46a302, 0 0 0 8px rgba(88, 204, 2, 0.3), inset 0 -4px 0 rgba(0,0,0,0.1);
            animation: pulseActive 2s infinite;
        }

        @keyframes pulseActive {
            0% { box-shadow: 0 8px 0 #46a302, 0 0 0 8px rgba(88, 204, 2, 0.3), inset 0 -4px 0 rgba(0,0,0,0.1); }
            50% { box-shadow: 0 8px 0 #46a302, 0 0 0 15px rgba(88, 204, 2, 0.1), inset 0 -4px 0 rgba(0,0,0,0.1); }
            100% { box-shadow: 0 8px 0 #46a302, 0 0 0 8px rgba(88, 204, 2, 0.3), inset 0 -4px 0 rgba(0,0,0,0.1); }
        }

        .node-locked {
            background-color: #37464f;
            box-shadow: 0 8px 0 #202f36;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .final-logo {
            width: 120px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(255, 200, 0, 0.6));
            animation: floatLogo 3s ease-in-out infinite;
        }

        @keyframes floatLogo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px) scale(1.05); }
        }

        #avatar {
            position: absolute;
            font-size: 50px;
            transition: top 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), left 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 5;
            pointer-events: none;
            filter: drop-shadow(0 10px 5px rgba(0,0,0,0.3));
        }

        .floating {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Modal Overlay Umum */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none; /* Disembunyikan secara default, diatur oleh JS */
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            color: #333;
            width: 85%;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-content.show { transform: scale(1); }
        .modal-content h3 { font-size: 22px; margin-bottom: 15px; color: #131f24; }
        
        /* Form Login/Daftar */
        .input-field {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 2px solid #e5e5e5;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-field:focus {
            border-color: #1cb0f6;
        }

        .modal-btn {
            background-color: #1cb0f6; border: none; box-shadow: 0 4px 0 #1899d6;
            color: white; padding: 15px 30px; font-size: 16px; font-weight: bold;
            border-radius: 15px; cursor: pointer; width: 100%; transition: 0.1s;
        }
        .modal-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #1899d6; }
        
        .video-mockup {
            width: 100%; height: 120px; background: #ddd; border-radius: 10px; margin-bottom: 20px;
            display: flex; justify-content: center; align-items: center; font-size: 40px; color: #ff0000;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="stat"><span style="color: #ffc800;">👑</span> 1</div>
        <div class="stat"><span style="color: #ff4b4b;">❤️</span> 5</div>
        <div class="stat"><span style="color: #1cb0f6;">💎</span> <span id="username-display">Guest</span></div>
    </div>

    <div class="unit-banner">
        <h2>Bagian 1, Unit 1</h2>
        <p>Tonton video, jawab soal, dan maju ke level selanjutnya!</p>
    </div>

    <div class="path-container" id="path-area">
        <div id="avatar" class="floating">🦉</div>
    </div>

    <!-- Modal Login / Daftar -->
    <div class="modal-overlay" id="login-modal" style="display: flex;">
        <div class="modal-content show" id="login-box">
            <h3>Daftar & Mulai Belajar!</h3>
            <p style="font-size: 14px; margin-bottom: 20px; color: #777;">Masukkan data Anda untuk menyimpan progres.</p>
            <input type="text" id="user-name" class="input-field" placeholder="Nama Panggilan" required>
            <input type="email" id="user-email" class="input-field" placeholder="Email Anda" required>
            <button class="modal-btn" onclick="registerUser()">Mulai Sekarang</button>
        </div>
    </div>

    <!-- Modal Simulasi Tugas -->
    <div class="modal-overlay" id="task-modal">
        <div class="modal-content" id="modal-box">
            <h3>Belajar Dulu!</h3>
            <div class="video-mockup">▶️</div>
            <p style="margin-bottom: 20px; font-weight:bold;">1 + 1 = ?</p>
            <button class="modal-btn" onclick="completeTask()">Selesaikan Level</button>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // KONFIGURASI TELEGRAM BOT
    // ==========================================
    const TELEGRAM_BOT_TOKEN = 'GANTI_DENGAN_TOKEN_BOT_ANDA'; 
    const TELEGRAM_CHAT_ID = 'GANTI_DENGAN_CHAT_ID_ANDA';
    // ==========================================

    const totalLevels = 10;
    let currentLevel = 1;
    const pathArea = document.getElementById('path-area');
    const avatar = document.getElementById('avatar');
    const taskModal = document.getElementById('task-modal');
    const taskModalBox = document.getElementById('modal-box');
    const loginModal = document.getElementById('login-modal');
    const usernameDisplay = document.getElementById('username-display');

    const wavePattern = [0, -40, -60, -40, 0, 40, 60, 40];

    // Cek apakah user sudah login sebelumnya
    window.onload = () => {
        const savedName = localStorage.getItem('app_username');
        if (savedName) {
            loginModal.style.display = 'none';
            usernameDisplay.innerText = savedName;
        }
        generateLevels();
    };

    // Fungsi Registrasi User
    function registerUser() {
        const name = document.getElementById('user-name').value.trim();
        const email = document.getElementById('user-email').value.trim();

        if (name === "" || email === "") {
            alert("Harap isi nama dan email terlebih dahulu!");
            return;
        }

        // Simpan di browser agar tidak perlu login berulang kali
        localStorage.setItem('app_username', name);
        localStorage.setItem('app_email', email);
        usernameDisplay.innerText = name;

        // Hilangkan modal login
        loginModal.style.display = 'none';

        // Kirim notifikasi ke Telegram
        sendTelegramNotification(name, email);
    }

    // Fungsi Kirim Data ke Telegram
    function sendTelegramNotification(name, email) {
        // Jika token belum diisi, jangan jalankan fetch untuk mencegah error
        if (TELEGRAM_BOT_TOKEN === '8977611687:AAERoPUXUexxUnPIX_vVVHKfL00mql5u7_A') return; 

        const message = `🔔 *USER BARU MENDAFTAR!*\n\n👤 *Nama:* ${name}\n📧 *Email:* ${email}\n⏱ *Waktu:* ${new Date().toLocaleString('id-ID')}`;
        const telegramUrl = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

        fetch(telegramUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                chat_id: 6815352186,
                text: message,
                parse_mode: 'Markdown'
            })
        }).then(response => {
            console.log("Data berhasil dikirim ke Telegram!");
        }).catch(error => {
            console.error("Gagal mengirim ke Telegram:", error);
        });
    }

    // Fungsi Generate Level[span_1](start_span)[span_1](end_span)
    function generateLevels() {
        for (let i = 1; i <= totalLevels; i++) {
            const node = document.createElement('div');
            node.classList.add('level-node');
            node.id = `level-${i}`;
            node.innerHTML = (i % 5 === 0) ? '🎁' : '⭐';
            const offset = wavePattern[(i - 1) % wavePattern.length];
            node.style.transform = `translateX(${offset}px)`;
            node.onclick = () => handleNodeClick(i);
            pathArea.appendChild(node);
        }
        
        const topLogo = document.createElement('img');
        topLogo.src = '50202.png'; 
        topLogo.alt = 'Logo Universitas Indonesia';
        topLogo.className = 'final-logo';
        pathArea.appendChild(topLogo);

        updateLevels();
    }

    function updateLevels() {
        for (let i = 1; i <= totalLevels; i++) {
            const node = document.getElementById(`level-${i}`);
            node.className = 'level-node';
            
            if (i < currentLevel) {
                node.classList.add('node-completed');
            } else if (i === currentLevel) {
                node.classList.add('node-active');
                moveAvatarTo(node);
            } else {
                node.classList.add('node-locked');
            }
        }
    }

    function moveAvatarTo(nodeElement) {
        setTimeout(() => {
            const offsetTop = nodeElement.offsetTop;
            avatar.style.top = `${offsetTop - 45}px`;
            const transformX = parseInt(nodeElement.style.transform.match(/-?\d+/)[0]);
            avatar.style.left = `calc(50% + ${transformX}px + 20px)`; 
            nodeElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
    }

    function handleNodeClick(levelIndex) {
        if (levelIndex === currentLevel) {
            taskModal.style.display = 'flex';
            setTimeout(() => taskModalBox.classList.add('show'), 10);
        } else if (levelIndex > currentLevel) {
            const node = document.getElementById(`level-${levelIndex}`);
            node.style.transform = `translateX(${wavePattern[(levelIndex - 1) % wavePattern.length]}px) scale(0.9)`;
            setTimeout(() => {
                node.style.transform = `translateX(${wavePattern[(levelIndex - 1) % wavePattern.length]}px) scale(1)`;
            }, 150);
        }
    }

    function completeTask() {
        taskModalBox.classList.remove('show');
        setTimeout(() => {
            taskModal.style.display = 'none';
            if (currentLevel < totalLevels) {
                currentLevel++;
                updateLevels();
            } else {
                alert("Selamat! Anda telah menyelesaikan semua level dan mencapai puncak!");
            }
        }, 300);
    }
</script>

</body>
</html>
