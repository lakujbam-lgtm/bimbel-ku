<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <title>BimbelKu - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center font-sans px-4">
  <div class="bg-slate-800 border border-slate-700 rounded-2xl p-8 w-full max-w-md shadow-2xl">
    <div class="text-center mb-6">
      <a href="index.html" class="font-bold text-2xl text-sky-500 block mb-2">Bimbel<span class="text-white">Ku</span></a>
      <h3 class="text-xl font-bold text-white">Login Akun</h3>
      <p class="text-xs text-slate-400 mt-1">Masukkan kredensial akun Anda</p>
    </div>
    <form onsubmit="prosesLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Username</label>
        <input type="text" id="login-username" required class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-sky-500" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
        <input type="password" id="login-password" required class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-sky-500" />
      </div>
      <p id="login-error" class="text-xs text-rose-500 font-medium hidden text-center"></p>
      <button type="submit" class="w-full py-3 bg-sky-600 hover:bg-sky-500 text-white font-semibold rounded-xl text-sm shadow-lg">Masuk</button>
    </form>
    <div class="text-center mt-4 pt-4 border-t border-slate-700">
      <p class="text-xs text-slate-400">Belum punya akun? <a href="daftar.html" class="text-emerald-400 font-semibold hover:underline">Daftar di sini</a></p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
