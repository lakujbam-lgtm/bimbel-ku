<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <title>BimbelKu - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">
  <div class="max-w-md mx-auto my-16 px-4 w-full">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 sm:p-8 shadow-2xl">
      <h3 class="text-2xl font-bold text-white text-center mb-6">Login BimbelKu</h3>
      <form onsubmit="prosesLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Username</label>
          <input type="text" id="login-username" required class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
          <input type="password" id="login-password" required class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white" />
        </div>
        <p id="login-error" class="text-xs text-rose-500 font-medium hidden text-center"></p>
        <button type="submit" class="w-full py-3 bg-sky-600 hover:bg-sky-500 text-white font-semibold rounded-xl text-sm">Masuk</button>
      </form>
      <div class="text-center mt-4 pt-4 border-t border-slate-700">
        <p class="text-xs text-slate-400">Belum punya akun? <a href="daftar.html" class="text-sky-400 font-semibold hover:underline">Daftar sekarang</a></p>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
